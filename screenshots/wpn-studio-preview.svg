<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#studioBg)" />

  <!-- Window Header -->
  <rect x="0" y="0" width="960" height="42" fill="#090e17" stroke="#1e293b" stroke-width="1" />
  <circle cx="20" cy="21" r="5" fill="#ef4444" />
  <circle cx="36" cy="21" r="5" fill="#eab308" />
  <circle cx="52" cy="21" r="5" fill="#22c55e" />
  <text x="480" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="600">
    WPNForge Pro — CCSDS 883.0-B-2 Wireless Proximity Network Cockpit
  </text>
  <rect x="820" y="10" width="125" height="22" rx="4" fill="#065f46" />
  <text x="882" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34d399" text-anchor="middle" font-weight="700">100% COMPLIANT</text>

  <!-- Telemetry Bar -->
  <g transform="translate(24, 56)">
    <!-- Tile 1 -->
    <rect x="0" y="0" width="215" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">PROXIMITY CLIENTS</text>
    <text x="16" y="48" font-family="monospace" font-size="20" fill="#38bdf8" font-weight="bold">3 ACTIVE</text>

    <!-- Tile 2 -->
    <rect x="230" y="0" width="215" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="246" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">MAX LINK RATE</text>
    <text x="246" y="48" font-family="monospace" font-size="20" fill="#4ade80" font-weight="bold">600.4 Mbps</text>

    <!-- Tile 3 -->
    <rect x="460" y="0" width="215" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="476" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">FSPL PATH LOSS</text>
    <text x="476" y="48" font-family="monospace" font-size="20" fill="#facc15" font-weight="bold">99.8 dB</text>

    <!-- Tile 4 -->
    <rect x="690" y="0" width="220" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="706" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">SOIS WPN AUDIT</text>
    <text x="706" y="48" font-family="monospace" font-size="20" fill="#34d399" font-weight="bold">10 / 10 PASS</text>
  </g>

  <!-- Main Left Column: Control Deck -->
  <g transform="translate(24, 130)">
    <rect x="0" y="0" width="280" height="385" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f8fafc" font-weight="bold">PROXIMITY RF CONTROLLER</text>
    <line x1="16" y1="36" x2="264" y2="36" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">ACTIVE CLIENT NODE</text>
    <rect x="16" y="66" width="248" height="28" rx="4" fill="#070c14" stroke="#334155" stroke-width="1" />
    <text x="26" y="84" font-family="monospace" font-size="10" fill="#cbd5e1">Artemis xEMU Spacesuit Crew 1</text>

    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">EDCA ACCESS CATEGORY</text>
    <rect x="16" y="120" width="248" height="28" rx="4" fill="#070c14" stroke="#334155" stroke-width="1" />
    <text x="26" y="138" font-family="monospace" font-size="10" fill="#cbd5e1">AC_VO: Critical Telemetry (150μs)</text>

    <text x="16" y="166" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">SECURITY &amp; CIPHER SUITE</text>
    <rect x="16" y="174" width="248" height="28" rx="4" fill="#070c14" stroke="#334155" stroke-width="1" />
    <text x="26" y="192" font-family="monospace" font-size="10" fill="#cbd5e1">WPA3-Enterprise 192 (Suite B)</text>

    <!-- Action Buttons -->
    <rect x="16" y="218" width="248" height="32" rx="4" fill="#0284c7" />
    <text x="140" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">EVALUATE RF LINK BUDGET</text>

    <rect x="16" y="260" width="248" height="32" rx="4" fill="#059669" />
    <text x="140" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">DISPATCH PROXIMITY PACKET</text>

    <rect x="16" y="302" width="248" height="32" rx="4" fill="#7c3aed" />
    <text x="140" y="322" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">ROUTE VIA 3GPP GWCN</text>

    <!-- Info Status -->
    <rect x="16" y="344" width="248" height="28" rx="4" fill="#0b1320" stroke="#1e293b" />
    <text x="26" y="362" font-family="monospace" font-size="9" fill="#10b981">MCS11 (1024-QAM 5/6) • 80MHz BW</text>
  </g>

  <!-- Right Top: RF Metrics Viewer -->
  <g transform="translate(320, 130)">
    <rect x="0" y="0" width="616" height="180" rx="8" fill="#050811" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="616" height="26" rx="8" fill="#090e17" />
    <text x="16" y="17" font-family="monospace" font-size="10" fill="#64748b">RF LINK BUDGET &amp; PHYSICAL CHANNEL PROPAGATION</text>

    <g font-family="monospace" font-size="10" fill="#38bdf8">
      <text x="16" y="48">Target Client:       Artemis xEMU Spacesuit Crew 1 [CLIENT_EVA_01]</text>
      <text x="16" y="68">Carrier Frequency:   5.18 GHz (IEEE 802.11ax Wi-Fi 6 UNII-1)</text>
      <text x="16" y="88">Distance &amp; Kinematics: 450.0 meters @ 1.2 m/s relative velocity</text>
      <text x="16" y="108" fill="#4ade80">Free Space Loss:     99.78 dB | Received Power: -66.78 dBm (SNR: 32.2 dB)</text>
      <text x="16" y="128" fill="#4ade80">Throughput Capacity: 600.4 Mbps (MCS11 1024-QAM 5/6)</text>
      <text x="16" y="148" fill="#facc15">Doppler Shift:       20.73 Hz (Compensated)</text>
      <text x="16" y="168" fill="#a855f7">GWCN Multi-PLMN:     NASA Artemis Core (PLMN 001-01) via Shared gNB</text>
    </g>
  </g>

  <!-- Right Bottom: Compliance & Telemetry Log -->
  <g transform="translate(320, 325)">
    <rect x="0" y="0" width="616" height="190" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f8fafc" font-weight="bold">SOIS HDR-WPN NORMATIVE TELEMETRY LOG</text>
    <line x1="16" y1="34" x2="600" y2="34" stroke="#1e293b" stroke-width="1" />

    <g font-family="monospace" font-size="9" fill="#94a3b8">
      <text x="16" y="52" fill="#38bdf8">[06:40:01.100] WPNForge Pro v1.0.0 Online. Standard: CCSDS 883.0-B-2.</text>
      <text x="16" y="70" fill="#cbd5e1">[06:40:01.112] [RADIO] IEEE 802.11ax Wi-Fi 6 &amp; 3GPP 5G NR Dual-Stack Initialized.</text>
      <text x="16" y="88" fill="#4ade80">[06:40:02.001] [LINK EVAL] CLIENT_EVA_01: FSPL=99.78dB, Prx=-66.78dBm, MCS11 600.4 Mbps.</text>
      <text x="16" y="106" fill="#facc15">[06:40:02.304] --&gt; [TX] Dispatched 1400B on AC_VO (Delay=150μs) to Artemis xEMU.</text>
      <text x="16" y="124" fill="#4ade80">[06:40:02.315] &lt;-- [RX] Ack received via WPA3-Enterprise 192 (GCMP-256 / Suite B).</text>
      <text x="16" y="142" fill="#cbd5e1">[06:40:03.110] [3GPP GWCN] Routed 1400B packet to NASA Artemis Core (PLMN 001-01) over Shared gNB.</text>
      <text x="16" y="160" fill="#a855f7">[06:40:04.200] [AUDIT] 10/10 Normative Requirements Verified PASS (100.0% Compliant).</text>
      <text x="16" y="178" fill="#34d399">[06:40:05.000] Status: CCSDS_883_0_HDR_WPN_CERTIFIED.</text>
    </g>
  </g>
</svg>
